<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #F2E9D8;
      --ink: #0F1B2D;
      --red: #B0202E;
      --green: #5C8264;
      --gold: #C9A961;
      --muted: #626B78;
      --border: #E5DDC8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 2064px;
      height: 2752px;
      overflow: hidden;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    }
    .art {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(242,233,216,.70), rgba(242,233,216,.94)),
        url("file:///Users/ovsh/Documents/code/peptide-lab/mobile/store-assets/app-store/backdrops/gpt-image-2-clinical-ledger-backdrop.png");
      background-size: cover;
      background-position: center;
    }
    .art::before {
      content: "";
      position: absolute;
      left: 104px;
      right: 104px;
      top: 58px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--red), var(--ink), var(--red), transparent);
      opacity: .55;
      z-index: 2;
    }
    .copy {
      position: absolute;
      z-index: 4;
      left: 112px; top: 126px; width: 720px; text-align: left;
    }
    .kicker {
      margin: 0 0 18px;
      color: var(--red);
      font-size: 34px;
      line-height: 1;
      letter-spacing: 8px;
      font-weight: 900;
    }
    h1 {
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 98px;
      line-height: .98;
      letter-spacing: 0;
      text-wrap: balance;
    }
    .sub {
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 38px;
      line-height: 1.18;
      font-weight: 800;
      text-wrap: balance;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    .chips span {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 17px;
      border: 1px solid rgba(15,27,45,.13);
      border-radius: 999px;
      background: rgba(255,255,255,.62);
      color: var(--ink);
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(15,27,45,.05);
    }
    .chips span::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
    }
    .device {
      position: absolute;
      z-index: 3;
      width: 1120px;
      right: 96px; bottom: 74px;
      border-radius: 72px;
      border: 8px solid rgba(15,27,45,.96);
      overflow: hidden;
      background: #FFFDF6;
      box-shadow:
        0 42px 90px rgba(15,27,45,.25),
        0 0 0 2px rgba(255,255,255,.8) inset;
    }
	    .device img {
	      display: block;
	      width: 100%;
	      height: auto;
	    }
	    .mock-screen {
	      width: 100%;
	      height: 2140px;
	      background: #F2E9D8;
	      color: var(--ink);
	      overflow: hidden;
	      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
	    }
	    .mock-status {
	      display: flex;
	      justify-content: space-between;
	      align-items: center;
	      padding: 64px 92px 36px;
	      color: #05070B;
	      font-size: 42px;
	      font-weight: 900;
	    }
	    .status-icons {
	      font-size: 31px;
	      letter-spacing: 0;
	    }
	    .mock-nav {
	      position: relative;
	      display: flex;
	      justify-content: center;
	      align-items: center;
	      padding: 58px 72px 42px;
	      color: var(--ink);
	    }
	    .mock-nav .close {
	      position: absolute;
	      left: 72px;
	      top: 54px;
	      font-size: 56px;
	      line-height: 1;
	      font-weight: 400;
	    }
	    .mock-nav strong {
	      font-family: Georgia, "Times New Roman", serif;
	      font-size: 55px;
	      line-height: 1;
	    }
	    .mock-content {
	      padding: 26px 70px 120px;
	    }
	    .mock-title-row {
	      display: flex;
	      align-items: baseline;
	      justify-content: space-between;
	      gap: 28px;
	    }
	    .mock-title-row h2 {
	      margin: 0;
	      font-family: Georgia, "Times New Roman", serif;
	      font-size: 72px;
	      line-height: 1;
	      letter-spacing: 0;
	    }
	    .mock-title-row p {
	      margin: 0;
	      max-width: 360px;
	      color: var(--muted);
	      font-size: 24px;
	      line-height: 1.2;
	      font-weight: 900;
	      letter-spacing: 3px;
	      text-align: right;
	    }
	    .mock-sub {
	      margin: 24px 0 44px;
	      color: var(--muted);
	      font-size: 32px;
	      line-height: 1.28;
	      font-weight: 700;
	    }
	    .mock-card {
	      margin-top: 34px;
	      padding: 38px 42px;
	      border-radius: 30px;
	      border: 1px solid rgba(15,27,45,.10);
	      background: #FFFDF8;
	    }
	    .mock-card.muted {
	      background: #F7F0E2;
	    }
	    .mock-field {
	      padding: 0 0 30px;
	      margin-bottom: 30px;
	      border-bottom: 1px solid rgba(15,27,45,.09);
	    }
	    .mock-field.last {
	      padding-bottom: 0;
	      margin-bottom: 0;
	      border-bottom: 0;
	    }
	    .mock-field label,
	    .mock-card label {
	      display: block;
	      margin-bottom: 20px;
	      color: #69717E;
	      font-size: 25px;
	      line-height: 1;
	      letter-spacing: 6px;
	      font-weight: 900;
	    }
	    .mock-field .accent,
	    .mock-card .accent {
	      color: var(--red);
	    }
	    .mock-field div {
	      display: flex;
	      align-items: baseline;
	      justify-content: space-between;
	      gap: 24px;
	    }
	    .mock-field strong {
	      font-size: 64px;
	      line-height: .95;
	      font-weight: 700;
	    }
	    .mock-field span {
	      color: var(--muted);
	      font-size: 42px;
	      font-weight: 800;
	    }
	    .mock-field em {
	      display: block;
	      margin-top: 18px;
	      color: #7E8794;
	      font-size: 25px;
	      line-height: 1.2;
	      font-style: normal;
	      font-weight: 700;
	    }
	    .mock-result {
	      display: flex;
	      align-items: baseline;
	      gap: 22px;
	      margin-top: 16px;
	    }
	    .mock-result strong {
	      color: var(--red);
	      font-family: Georgia, "Times New Roman", serif;
	      font-size: 94px;
	      line-height: .95;
	    }
	    .mock-result span {
	      color: var(--muted);
	      font-family: Georgia, "Times New Roman", serif;
	      font-size: 40px;
	      font-weight: 800;
	    }
	    .mock-grid {
	      display: grid;
	      grid-template-columns: 1fr 1fr;
	      gap: 34px;
	      margin-top: 44px;
	      padding-top: 32px;
	      border-top: 1px solid rgba(15,27,45,.10);
	    }
	    .mock-grid label {
	      font-size: 21px;
	      letter-spacing: 4px;
	      margin-bottom: 10px;
	    }
	    .mock-grid p {
	      margin: 0;
	      color: var(--ink);
	      font-size: 31px;
	      line-height: 1.15;
	      font-weight: 900;
	    }
	    .mock-note {
	      margin-top: 36px;
	      padding: 28px;
	      border-radius: 18px;
	      border: 1px solid rgba(15,27,45,.10);
	      background: #FFFDF8;
	      color: var(--muted);
	      font-size: 27px;
	      line-height: 1.25;
	      font-weight: 700;
	    }
	    .mock-volume-meter {
	      display: flex;
	      align-items: center;
	      gap: 0;
	      margin-top: 38px;
	      padding: 22px 0 8px;
	    }
	    .meter-plunger {
	      width: 36px;
	      height: 18px;
	      background: #D7CEB9;
	    }
	    .meter-barrel {
	      position: relative;
	      flex: 1;
	      height: 36px;
	      border: 2px solid var(--ink);
	      border-radius: 4px;
	      background: #FFFDF8;
	    }
	    .meter-fill {
	      position: absolute;
	      left: 0;
	      top: 0;
	      bottom: 0;
	      width: 10%;
	      background: rgba(176,32,46,.60);
	    }
	    .meter-ticks {
	      position: absolute;
	      left: 0;
	      right: 0;
	      top: -32px;
	      height: 28px;
	    }
	    .meter-ticks::before {
	      content: "";
	      position: absolute;
	      left: 0;
	      right: 0;
	      bottom: 0;
	      height: 14px;
	      background: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 5%);
	      opacity: .65;
	    }
	    .meter-ticks span {
	      position: absolute;
	      top: -2px;
	      transform: translateX(-50%);
	      color: var(--muted);
	      font-size: 18px;
	      line-height: 1;
	      font-weight: 800;
	    }
	    .meter-barrel b {
	      position: absolute;
	      left: 10%;
	      top: 48px;
	      transform: translateX(-50%);
	      color: var(--red);
	      font-size: 22px;
	      line-height: 1;
	      font-weight: 900;
	    }
	    .meter-barrel b::before {
	      content: "";
	      position: absolute;
	      left: 50%;
	      top: -16px;
	      width: 2px;
	      height: 14px;
	      background: var(--red);
	    }
	    .meter-tip {
	      width: 48px;
	      height: 2px;
	      background: var(--ink);
	    }
	    .device::after {
	      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.72);
      pointer-events: none;
    }
    .badge {
      position: absolute;
      z-index: 5;
      left: 112px; bottom: 150px; width: 610px;
      display: block;
      padding: 30px 34px;
      border: 1px solid rgba(15,27,45,.12);
      border-radius: 28px;
      background: rgba(255,255,255,.66);
      box-shadow: 0 24px 60px rgba(15,27,45,.10);
      backdrop-filter: blur(8px);
    }
    .badge strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      line-height: 1.08;
    }
    .badge p {
      margin: 0;
      color: var(--muted);
      font-size: 23px;
      line-height: 1.25;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="art">
    <section class="copy">
      <p class="kicker">BODY SITES</p>
      <h1>See every body site.</h1>
      <p class="sub">Tap front or back and keep rotation visible while you log.</p>
      <div class="chips"><span>Front &amp; back</span><span>All sites</span><span>Rotation context</span></div>
    </section>
    <section class="badge">
      <strong>Made for repeat routines.</strong>
      <p>Clear logs, calm charts, and less context switching.</p>
    </section>
	    <div class="device">
	      <img src="file:///Users/ovsh/Documents/code/peptide-lab/mobile/store-assets/app-store/screenshots/real-scerenshots/WhatsApp%20Image%202026-04-30%20at%2001.25.15.jpeg" alt="">
	    </div>
	  </main>
</body>
</html>
