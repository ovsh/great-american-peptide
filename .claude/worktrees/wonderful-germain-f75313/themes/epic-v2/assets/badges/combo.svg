<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <radialGradient id="navyGrad" cx=".5" cy=".4" r=".75">
      <stop offset="0" stop-color="#13316A"/>
      <stop offset="1" stop-color="#08183A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D58E"/>
      <stop offset=".5" stop-color="#C5A572"/>
      <stop offset="1" stop-color="#8E7340"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E03244"/>
      <stop offset="1" stop-color="#7C0A12"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCEB"/>
      <stop offset="1" stop-color="#F0E6CB"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- navy field -->
  <rect width="1200" height="1200" fill="url(#navyGrad)"/>

  <!-- gold border -->
  <g stroke="url(#goldGrad)" fill="none">
    <rect x="50" y="50" width="1100" height="1100" stroke-width="2"/>
    <rect x="68" y="68" width="1064" height="1064" stroke-width="6"/>
    <rect x="92" y="92" width="1016" height="1016" stroke-width="1" opacity=".5"/>
  </g>

  <!-- corner stars -->
  <g fill="url(#goldGrad)" font-family="Georgia, 'Times New Roman', serif" font-size="44" text-anchor="middle">
    <text x="84" y="114">★</text>
    <text x="1116" y="114">★</text>
    <text x="84" y="1130">★</text>
    <text x="1116" y="1130">★</text>
  </g>

  <!-- top eyebrow -->
  <g text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="200" font-size="32" letter-spacing="20">G  A  P  C</text>
    <line x1="380" y1="222" x2="820" y2="222" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="600" y="252" font-size="18" letter-spacing="9">FULL CERTIFICATE OF ANALYSIS</text>
  </g>

  <!-- LEFT MEDALLION: chromatogram peak -->
  <g transform="translate(370, 540)" filter="url(#dropShadow)">
    <circle r="220" fill="url(#redGrad)" opacity=".08"/>
    <circle r="200" fill="none" stroke="url(#redGrad)" stroke-width="8"/>
    <circle r="184" fill="none" stroke="url(#redGrad)" stroke-width="1.5"/>
    <circle r="166" fill="url(#creamGrad)"/>
    <circle r="160" fill="none" stroke="url(#redGrad)" stroke-width="1" opacity=".25"/>

    <!-- ring label top -->
    <path id="leftRingTop" d="M 0 0 m -192 0 a 192 192 0 1 1 384 0" fill="none"/>
    <path id="leftRingBot" d="M 0 0 m -192 0 a 192 192 0 0 0 384 0" fill="none"/>
    <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" fill="url(#redGrad)" letter-spacing="11">
      <textPath href="#leftRingTop" startOffset="50%" text-anchor="middle">PURITY  ★  HPLC-UV</textPath>
    </text>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="url(#redGrad)" letter-spacing="10">
      <textPath href="#leftRingBot" startOffset="50%" text-anchor="middle">214 nm  ·  CERTIFIED</textPath>
    </text>

    <!-- inside peak -->
    <path d="
      M -90 90
      L -50 90
      Q -25 88 -10 86
      Q -3 80 -1 -50
      Q 0 -80 1 -50
      Q 3 80 10 86
      Q 25 88 50 90
      L 90 90 Z"
      fill="url(#redGrad)"/>
    <line x1="-110" y1="92" x2="110" y2="92" stroke="url(#redGrad)" stroke-width="1.5" opacity=".7"/>
    <text x="0" y="-90" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="36" fill="url(#redGrad)" text-anchor="middle" letter-spacing="2">99.8%</text>
  </g>

  <!-- RIGHT MEDALLION: PASS -->
  <g transform="translate(830, 540)" filter="url(#dropShadow)">
    <circle r="220" fill="url(#redGrad)" opacity=".08"/>
    <circle r="200" fill="none" stroke="url(#redGrad)" stroke-width="8"/>
    <circle r="184" fill="none" stroke="url(#redGrad)" stroke-width="1.5"/>
    <circle r="166" fill="url(#redGrad)"/>
    <circle r="160" fill="none" stroke="url(#creamGrad)" stroke-width="1" opacity=".5"/>

    <!-- ring label top -->
    <path id="rightRingTop" d="M 0 0 m -192 0 a 192 192 0 1 1 384 0" fill="none"/>
    <path id="rightRingBot" d="M 0 0 m -192 0 a 192 192 0 0 0 384 0" fill="none"/>
    <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" fill="url(#goldGrad)" letter-spacing="11">
      <textPath href="#rightRingTop" startOffset="50%" text-anchor="middle">ENDOTOXIN  ★  LAL</textPath>
    </text>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="url(#goldGrad)" letter-spacing="10">
      <textPath href="#rightRingBot" startOffset="50%" text-anchor="middle">PHARMACY GRADE</textPath>
    </text>

    <!-- center PASS -->
    <text x="0" y="-12" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="92" fill="url(#creamGrad)" text-anchor="middle" letter-spacing="6">PASS</text>
    <line x1="-72" y1="14" x2="72" y2="14" stroke="url(#creamGrad)" stroke-width="1.5" opacity=".7"/>
    <text x="0" y="50" font-family="Menlo, monospace" font-size="22" fill="url(#creamGrad)" text-anchor="middle" letter-spacing="3">&#60; 0.25 EU/mg</text>
  </g>

  <!-- center plus -->
  <g text-anchor="middle">
    <circle cx="600" cy="540" r="34" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="600" y="556" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="url(#goldGrad)">+</text>
  </g>

  <!-- huge wordmark -->
  <g text-anchor="middle">
    <text x="600" y="930" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="200" fill="url(#creamGrad)" letter-spacing="20">COMBO</text>
    <line x1="370" y1="970" x2="830" y2="970" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="600" y="1020" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="url(#goldGrad)" letter-spacing="12">PURITY  +  ENDOTOXIN  ·  ONE VIAL</text>
  </g>

  <!-- bottom seal -->
  <g text-anchor="middle">
    <text x="600" y="1080" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="url(#goldGrad)" letter-spacing="6" opacity=".85">ISO/IEC 17025  ·  A2LA ACCREDITED</text>
  </g>
</svg>
