<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <radialGradient id="navyGrad" cx=".5" cy=".4" r=".75">
      <stop offset="0" stop-color="#13316A"/>
      <stop offset="1" stop-color="#08183A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D58E"/>
      <stop offset=".5" stop-color="#C5A572"/>
      <stop offset="1" stop-color="#8E7340"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E03244"/>
      <stop offset="1" stop-color="#7C0A12"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCEB"/>
      <stop offset="1" stop-color="#F0E6CB"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- navy field -->
  <rect width="1200" height="1200" fill="url(#navyGrad)"/>

  <!-- gold border -->
  <g stroke="url(#goldGrad)" fill="none">
    <rect x="50" y="50" width="1100" height="1100" stroke-width="2"/>
    <rect x="68" y="68" width="1064" height="1064" stroke-width="6"/>
    <rect x="92" y="92" width="1016" height="1016" stroke-width="1" opacity=".5"/>
  </g>

  <!-- corner stars -->
  <g fill="url(#goldGrad)" font-family="Georgia, 'Times New Roman', serif" font-size="44" text-anchor="middle">
    <text x="84" y="114">★</text>
    <text x="1116" y="114">★</text>
    <text x="84" y="1130">★</text>
    <text x="1116" y="1130">★</text>
  </g>

  <!-- top eyebrow -->
  <g text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="200" font-size="32" letter-spacing="20">G  A  P  C</text>
    <line x1="430" y1="222" x2="770" y2="222" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="600" y="252" font-size="18" letter-spacing="9">CERTIFIED ANALYSIS</text>
  </g>

  <!-- chromatogram peak: bell flare base, sharp top -->
  <g filter="url(#dropShadow)">
    <path d="
      M 380 660
      L 470 660
      Q 510 658 545 656
      Q 568 654 580 620
      Q 590 540 597 360
      Q 600 320 603 360
      Q 610 540 620 620
      Q 632 654 655 656
      Q 690 658 730 660
      L 820 660 Z"
      fill="url(#redGrad)"/>
    <!-- peak inner highlight -->
    <path d="
      M 597 360 Q 600 320 603 360 Q 600 380 600 660 Z"
      fill="#FFFFFF" opacity=".22"/>
  </g>

  <!-- gold baseline + tick marks -->
  <g stroke="url(#goldGrad)" stroke-width="1" opacity=".7">
    <line x1="220" y1="662" x2="980" y2="662" stroke-width="1.5"/>
  </g>
  <g stroke="url(#goldGrad)" stroke-width="1" opacity=".5">
    <line x1="280" y1="662" x2="280" y2="678"/>
    <line x1="400" y1="662" x2="400" y2="678"/>
    <line x1="520" y1="662" x2="520" y2="678"/>
    <line x1="600" y1="662" x2="600" y2="680" stroke-width="1.5" opacity=".8"/>
    <line x1="680" y1="662" x2="680" y2="678"/>
    <line x1="800" y1="662" x2="800" y2="678"/>
    <line x1="920" y1="662" x2="920" y2="678"/>
  </g>
  <g font-family="Menlo, 'Courier New', monospace" font-size="14" fill="url(#goldGrad)" opacity=".7" text-anchor="middle" letter-spacing="3">
    <text x="280" y="704">1</text>
    <text x="400" y="704">2</text>
    <text x="520" y="704">3</text>
    <text x="600" y="704">4</text>
    <text x="680" y="704">5</text>
    <text x="800" y="704">6</text>
    <text x="920" y="704">7</text>
  </g>

  <!-- 99.8% callout aligned with peak top -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="url(#creamGrad)">
    <text x="780" y="380" font-size="68" font-weight="700" letter-spacing="2">99.8</text>
    <text x="912" y="380" font-size="40" font-weight="400" opacity=".75">%</text>
    <line x1="640" y1="320" x2="775" y2="356" stroke="url(#goldGrad)" stroke-width="1" opacity=".55"/>
  </g>

  <!-- huge wordmark -->
  <g text-anchor="middle">
    <text x="600" y="900" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="200" fill="url(#creamGrad)" letter-spacing="20">PURITY</text>
    <line x1="380" y1="940" x2="820" y2="940" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="600" y="990" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="url(#goldGrad)" letter-spacing="14">HPLC  ·  UV  ·  214 nm</text>
  </g>

  <!-- bottom seal -->
  <g text-anchor="middle">
    <text x="600" y="1080" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="url(#goldGrad)" letter-spacing="6" opacity=".85">ISO/IEC 17025  ·  A2LA ACCREDITED</text>
  </g>
</svg>
