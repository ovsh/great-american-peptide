<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2655"/>
      <stop offset="1" stop-color="#0A1F44"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5C77A"/>
      <stop offset=".5" stop-color="#C5A572"/>
      <stop offset="1" stop-color="#9B7E48"/>
    </linearGradient>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#FFF8E7"/>
      <circle cx="1" cy="1" r=".4" fill="#0A1F44" opacity=".035"/>
      <circle cx="4" cy="3" r=".3" fill="#0A1F44" opacity=".03"/>
    </pattern>
  </defs>

  <!-- navy field -->
  <rect width="1200" height="1200" fill="url(#navyGrad)"/>

  <!-- gold double border -->
  <rect x="40" y="40" width="1120" height="1120" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="60" y="60" width="1080" height="1080" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <rect x="84" y="84" width="1032" height="1032" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity=".6"/>

  <!-- corner stars -->
  <g fill="url(#goldGrad)" font-family="Times New Roman, serif" font-size="34" text-anchor="middle">
    <text x="60" y="78">★</text>
    <text x="1140" y="78">★</text>
    <text x="60" y="1146">★</text>
    <text x="1140" y="1146">★</text>
  </g>

  <!-- top eyebrow -->
  <g font-family="Times New Roman, serif" fill="url(#goldGrad)" text-anchor="middle">
    <text x="600" y="170" font-size="34" letter-spacing="14">THE GREAT AMERICAN PEPTIDE CO.</text>
    <line x1="380" y1="190" x2="820" y2="190" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="600" y="225" font-size="20" letter-spacing="10">CERTIFIED ANALYSIS</text>
  </g>

  <!-- cream document panel -->
  <rect x="140" y="280" width="920" height="620" fill="url(#grain)" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- chart area inside panel -->
  <g transform="translate(180, 330)">
    <!-- horizontal gridlines -->
    <g stroke="#0A1F44" stroke-width="1" opacity=".08">
      <line x1="0" y1="80"  x2="840" y2="80"/>
      <line x1="0" y1="160" x2="840" y2="160"/>
      <line x1="0" y1="240" x2="840" y2="240"/>
      <line x1="0" y1="320" x2="840" y2="320"/>
      <line x1="0" y1="400" x2="840" y2="400"/>
    </g>
    <!-- axes -->
    <line x1="0" y1="0" x2="0" y2="480" stroke="#0A1F44" stroke-width="2" opacity=".55"/>
    <line x1="0" y1="480" x2="840" y2="480" stroke="#0A1F44" stroke-width="2" opacity=".55"/>

    <!-- chromatogram trace, single tall peak -->
    <path d="
      M 0 470
      L 120 470
      Q 140 468 160 470
      Q 180 466 200 470
      L 280 470
      Q 320 468 360 468
      Q 380 468 390 466
      Q 410 60 420 30
      Q 430 60 450 466
      Q 460 468 480 468
      L 580 468
      Q 620 467 660 467
      Q 670 467 678 466
      Q 684 360 690 466
      Q 696 467 720 467
      L 840 467"
      fill="none" stroke="#B22234" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- main peak callout -->
    <line x1="420" y1="30" x2="420" y2="-12" stroke="#0A1F44" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="420" y="-22" font-family="Times New Roman, serif" font-weight="700" font-size="34" fill="#0A1F44" text-anchor="middle">99.80%</text>

    <!-- tick labels -->
    <g font-family="Menlo, monospace" font-size="14" fill="#0A1F44" opacity=".55" text-anchor="middle">
      <text x="140" y="500">1</text>
      <text x="280" y="500">2</text>
      <text x="420" y="500">3</text>
      <text x="560" y="500">4</text>
      <text x="700" y="500">5</text>
    </g>
    <text x="420" y="525" font-family="Menlo, monospace" font-size="13" fill="#0A1F44" opacity=".55" text-anchor="middle" letter-spacing="3">RETENTION TIME (MIN)</text>
  </g>

  <!-- title block -->
  <g text-anchor="middle">
    <text x="600" y="990" font-family="Times New Roman, serif" font-weight="700" font-size="120" fill="#FFF8E7" letter-spacing="14">PURITY</text>
    <line x1="430" y1="1018" x2="770" y2="1018" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="600" y="1058" font-family="Times New Roman, serif" font-size="28" fill="url(#goldGrad)" letter-spacing="10">HPLC · UV · 214 nm</text>
  </g>

  <!-- bottom seal -->
  <g transform="translate(600, 1090)" text-anchor="middle">
    <text font-family="Times New Roman, serif" font-size="18" fill="url(#goldGrad)" letter-spacing="6">ISO/IEC 17025  ·  A2LA ACCREDITED</text>
  </g>
</svg>
