<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <radialGradient id="navyGrad" cx=".5" cy=".4" r=".75">
      <stop offset="0" stop-color="#13316A"/>
      <stop offset="1" stop-color="#08183A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D58E"/>
      <stop offset=".5" stop-color="#C5A572"/>
      <stop offset="1" stop-color="#8E7340"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6293A"/>
      <stop offset="1" stop-color="#7C0A12"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCEB"/>
      <stop offset="1" stop-color="#F0E6CB"/>
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- navy field -->
  <rect width="1200" height="1200" fill="url(#navyGrad)"/>

  <!-- gold border -->
  <g stroke="url(#goldGrad)" fill="none">
    <rect x="50" y="50" width="1100" height="1100" stroke-width="2"/>
    <rect x="68" y="68" width="1064" height="1064" stroke-width="6"/>
    <rect x="92" y="92" width="1016" height="1016" stroke-width="1" opacity=".5"/>
  </g>

  <!-- corner stars -->
  <g fill="url(#goldGrad)" font-family="Georgia, 'Times New Roman', serif" font-size="44" text-anchor="middle">
    <text x="84" y="114">★</text>
    <text x="1116" y="114">★</text>
    <text x="84" y="1130">★</text>
    <text x="1116" y="1130">★</text>
  </g>

  <!-- top eyebrow -->
  <g text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="200" font-size="32" letter-spacing="20">G  A  P  C</text>
    <line x1="430" y1="222" x2="770" y2="222" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="600" y="252" font-size="18" letter-spacing="9">SAFETY ATTESTATION</text>
  </g>

  <!-- big circular pass seal -->
  <g transform="translate(600, 540)" filter="url(#sealShadow)">
    <!-- outer red disc as base for halo -->
    <circle r="290" fill="url(#redGrad)" opacity=".08"/>
    <!-- main red ring -->
    <circle r="262" fill="none" stroke="url(#redGrad)" stroke-width="10"/>
    <circle r="244" fill="none" stroke="url(#redGrad)" stroke-width="2"/>
    <!-- inner field -->
    <circle r="216" fill="url(#redGrad)"/>
    <circle r="208" fill="none" stroke="url(#creamGrad)" stroke-width="1.5" opacity=".6"/>

    <!-- curved label "ENDOTOXIN ★ CLEARED" on outer ring -->
    <path id="ringPathTop" d="M 0 0 m -253 0 a 253 253 0 1 1 506 0" fill="none"/>
    <path id="ringPathBot" d="M 0 0 m -253 0 a 253 253 0 0 0 506 0" fill="none"/>
    <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" fill="url(#goldGrad)" letter-spacing="13">
      <textPath href="#ringPathTop" startOffset="50%" text-anchor="middle">ENDOTOXIN  ★  CLEARED</textPath>
    </text>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="url(#goldGrad)" letter-spacing="11">
      <textPath href="#ringPathBot" startOffset="50%" text-anchor="middle">L A L  ·  PHARMACY GRADE</textPath>
    </text>

    <!-- center PASS -->
    <text x="0" y="-12" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="142" fill="url(#creamGrad)" text-anchor="middle" letter-spacing="8">PASS</text>
    <line x1="-100" y1="14" x2="100" y2="14" stroke="url(#creamGrad)" stroke-width="2" opacity=".7"/>
    <text x="0" y="64" font-family="Menlo, monospace" font-size="30" fill="url(#creamGrad)" text-anchor="middle" letter-spacing="5">&#60; 0.25 EU/mg</text>
    <text x="0" y="104" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="url(#creamGrad)" text-anchor="middle" opacity=".75">below pharmacy threshold</text>
  </g>

  <!-- huge wordmark -->
  <g text-anchor="middle">
    <text x="600" y="970" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="140" fill="url(#creamGrad)" letter-spacing="14">ENDOTOXIN</text>
    <line x1="380" y1="1006" x2="820" y2="1006" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="600" y="1042" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="url(#goldGrad)" letter-spacing="10">LIMULUS AMEBOCYTE LYSATE</text>
  </g>

  <!-- bottom seal -->
  <g text-anchor="middle">
    <text x="600" y="1080" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="url(#goldGrad)" letter-spacing="6" opacity=".85">ISO/IEC 17025  ·  A2LA ACCREDITED</text>
  </g>
</svg>
